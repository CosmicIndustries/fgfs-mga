name: Launcher checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  launcher:
    name: Launcher and controls tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install evdev PyQt5

      - name: Rebuild generated installer and audit script
        run: |
          bash launcher/build.sh
          git diff --exit-code -- launcher/install-fgfs-mga.sh launcher/fgfs-audit.sh

      - name: Check shell syntax
        run: |
          bash -n install.sh
          bash -n launcher/build.sh
          bash -n launcher/install-fgfs-mga.sh
          bash -n launcher/fgfs-audit.sh
          bash -n launcher/src/fgfs-mga
          bash -n launcher/src/install-body.sh
          bash -n launcher/tests/test.sh

      - name: Run launcher, controls, FFB bridge and Qt tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: bash launcher/tests/test.sh
