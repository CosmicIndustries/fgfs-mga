name: Safe FGData extraction checks

on:
  push:
    branches: [main]
    paths:
      - 'install.sh'
      - 'flightgear-2024.1.7/install-fgdata-safe.sh'
      - 'flightgear-2024.1.7/tests/test-fgdata-safe-extraction.sh'
      - '.github/workflows/fgdata-extraction-checks.yml'
  pull_request:
    branches: [main]
    paths:
      - 'install.sh'
      - 'flightgear-2024.1.7/install-fgdata-safe.sh'
      - 'flightgear-2024.1.7/tests/test-fgdata-safe-extraction.sh'
      - '.github/workflows/fgdata-extraction-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extraction:
    name: FGData safe extraction regression tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Check shell syntax
        run: |
          bash -n install.sh
          bash -n flightgear-2024.1.7/install-fgdata-safe.sh
          bash -n flightgear-2024.1.7/tests/test-fgdata-safe-extraction.sh
      - name: Test staging, digest, and destination safety
        run: bash flightgear-2024.1.7/tests/test-fgdata-safe-extraction.sh
