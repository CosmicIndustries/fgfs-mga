# MGA Balanced realism profile for ROCK 5B. Keeps scenery objects, vegetation,
# dynamic weather and 3D clouds at FlightGear defaults; only moderates shader quality.
--prop:/sim/rendering/quality-level=1
--prop:/sim/rendering/shaders/quality-level=1
--prop:/sim/frame-rate-throttle-hz=60
--prop:bool:/scenery/use-vpb=false
--prop:bool:/sim/rendering/scenery-path-suffix[98]/enabled=false
--disable-ai-traffic
