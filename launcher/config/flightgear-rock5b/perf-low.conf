# Minimum visual reference profile. This sacrifices environmental detail by design.
--prop:/sim/rendering/quality-level=0
--prop:/sim/rendering/shaders/quality-level=0
--prop:/sim/frame-rate-throttle-hz=30
--prop:bool:/scenery/use-vpb=false
--prop:bool:/sim/rendering/scenery-path-suffix[98]/enabled=false
--disable-ai-traffic
--disable-random-vegetation
--disable-random-buildings
--disable-random-objects
--disable-clouds3d
--disable-specular-highlight
